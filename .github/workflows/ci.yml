name: Сборка ОС Чёрное Море

# Запуск на каждый коммит (push в любую ветку) и на pull request.
on:
  push:
  pull_request:

# На быстрых сериях коммитов оставляем актуальным только последний запуск ветки.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # ОДНО задание: как на обычном ПК — установить зависимости и запустить
  #   cd Сборка && make
  # Оркестратор Сборка/основа.c сам собирает ядро (bzImage), busybox, init и
  # weston, раскладывает в rootfs и создаёт образ (создать_образ.sh →
  # конвертировать_образ.sh). VBoxManage на раннере нет — конвертация делает
  # только qcow2 (qemu-img) и не рвётся. Никаких отдельных джобов/артефактов
  # ядра: одна команда, воспроизводимая где угодно.
  # ---------------------------------------------------------------------------
  build:
    name: Сборка (deps + make)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # Инициализируем ТОЛЬКО загрузочные субмодули (depth 1 достаточно для сборки).
      # Остальные Программы/* (ТранспиляторКонда и т.п.) не нужны для образа —
      # основа.c пропускает пустые/уна­циализированные каталоги (нет Makefile).
      - name: Инициализация субмодулей (Ядро, busybox, Инициализация, weston)
        run: |
          git submodule update --init --depth 1 \
            "Программы/Ядро" "Программы/busybox" \
            "Программы/Инициализация" "Программы/weston"

      # Всё, что нужно для ядра + busybox + weston (wayland из subproject'ов) +
      # создания образа (loop/parted/mkfs) + qcow2 (qemu-img). ВАЖНО: meson/ninja
      # из apt НЕ ставим — apt их замораживает (Ubuntu 24.04 → meson 1.3.2), а по
      # политике проекта нужен ПОСЛЕДНИЙ тулчейн. Ставим их свежими из PyPI (ниже).
      # ВАЖНО-2: libwayland-dev НУЖЕН несмотря на wayland-из-subproject'а. weston
      # 16.0.0 в libweston/meson.build пробрасывает wayland-зависимость в session-
      # helper через partial_dependency(compile_args:) — БЕЗ includes → путь к
      # <wayland-server.h> из subproject'а теряется, компиляция launcher-libseat.c
      # падает «wayland-server.h: No such file». Базовый dev-заголовок берём из
      # системного libwayland-dev (как на обычной машине разработчика — там сборка
      # и идёт). Subproject остаётся ради СВЕЖИХ wayland-scanner/protocols (версии),
      # не ради базовых заголовков. Версия apt-libwayland тут роли не играет: линкуем
      # libwayland из subproject'а (force-fallback), из системы нужен лишь заголовок.
      - name: Установка зависимостей (свежий тулчейн)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential file binutils ccache \
            flex bison libssl-dev libelf-dev bc libncurses-dev dwarves cpio kmod \
            pkg-config python3 python3-venv python3-pip \
            libwayland-dev libffi-dev libexpat1-dev \
            libinput-dev libxkbcommon-dev libudev-dev libevdev-dev libmtdev-dev \
            libpixman-1-dev libdrm-dev libgbm-dev libegl-dev libgles2-mesa-dev \
            mesa-common-dev libgl-dev \
            libcairo2-dev libpango1.0-dev libfreetype-dev libfontconfig-dev \
            libpng-dev libjpeg-dev libwebp-dev liblcms2-dev libseat-dev \
            parted gdisk dosfstools e2fsprogs symlinks util-linux libc-bin qemu-utils
          # ПОЛИТИКА «только свежий тулчейн»: последние meson+ninja из PyPI в venv,
          # кладём в PATH для следующих шагов (gcc берём штатный с раннера — он
          # актуальный, не заморожен, в отличие от meson). Проверки версий и падение
          # на старье делает сама сборка (собрать-weston.sh, Сборка/Makefile).
          python3 -m venv "$HOME/.venv-build"
          "$HOME/.venv-build/bin/pip" install --upgrade pip meson ninja
          echo "$HOME/.venv-build/bin" >> "$GITHUB_PATH"
          echo "--- версии тулчейна ---"
          "$HOME/.venv-build/bin/meson" --version
          "$HOME/.venv-build/bin/ninja" --version
          gcc --version | head -1

      # Единственное «не лишнее» ускорение: кэш ccache между прогонами. Без него
      # ядро (bzImage) компилируется с нуля каждый push (~20–40 мин). ccache
      # подхватывается прозрачно через PATH=/usr/lib/ccache (ниже) — и для ядра,
      # и для weston.
      - name: Кэш ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-

      # Ровно то, что делает пользователь на своём ПК: одна команда.
      # PATH=/usr/lib/ccache подсовывает ccache-обёртки вместо gcc/cc.
      - name: Сборка — cd Сборка && make
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          ccache --max-size=2G >/dev/null 2>&1 || true
          make -C Сборка
          echo "--- ccache статистика ---"
          ccache -s || true

      - name: Артефакт образа (qcow2)
        uses: actions/upload-artifact@v4
        with:
          name: ОСЧерноеМоре-qcow2
          path: ОбразыДляЗагрузки/ОСЧерноеМоре.qcow2
          if-no-files-found: error
